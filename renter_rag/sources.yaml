legislation_terms: >
  Copyright in Victorian legislation is owned by the Government Printer. Authorised electronic
  versions are published on legislation.vic.gov.au "for personal use only"; other reproduction
  must be within the Copyright Act 1968 (Cth) (https://www.legislation.vic.gov.au/copyright).
  We use the text for non-commercial university research and study, relying on fair dealing for
  research or study (Copyright Act s 40; to be confirmed with our mentor), and we do NOT commit the downloaded files or the chunks built from them to GitHub. Anyone can rebuild
  them with `python fetch_sources.py`.

cav_guidance:
  folder: data/sources/cav            # 25 pages, each with url / last_updated / retrieved in its header
  publisher: Consumer Affairs Victoria
  retrieved: 2026-09-28
  terms: >
    Creative Commons Attribution 4.0 International (https://www.consumer.vic.gov.au/copyright),
    excluding logos and images. We keep only text and attribute every passage to its page URL.

scope: >
  Residential renting in Victoria: rental agreements, rooming houses, caravan parks / residential
  parks, specialist disability accommodation, bonds, VCAT tenancy disputes. Commercial / retail
  leases (Retail Leases Act 2003), strata / owners corporations, buying property, other states
  and federal Rent Assistance are deliberately out of scope.
