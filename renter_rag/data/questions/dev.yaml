# DEV set: used for every tuning decision (chunking, retriever, k, threshold).
#
# group:  answerable | near_miss (sounds like renting law but is not covered: other states, buying,
#         commercial leases, statistics, Centrelink ...) | off_topic (nothing to do with renting,
#         including prompt-injection attempts). The system should answer only `answerable`.
# style:  plain | scenario (a renter's situation) | legal (formal wording) | slang (informal /
#         non-native wording). legal and slang questions reword a plain one (`pair`) for the
#         fairness check, and copy its gold + facts.
# gold:   units that answer it. 2 = answers it, 1 = helpful. Units: RTA-s44 = Residential
#         Tenancies Act 1997 s 44, RTR-r32 = Residential Tenancies Regulations 2021 reg 32,
#         RTR-sch4-c5 = Regulations sch 4 cl 5, RHS-r7 = Rooming House Standards Regs reg 7,
#         CAV-RENTINC-05 = 5th heading of the CAV "Rent increases" page.
# facts:  regular expressions a correct answer must ALL contain (automatic check).
# answer: our reference answer.
#
# CAV gold was checked against the CAV pages saved 28 Sep 2026 (v1, rag_simple). Legislation
# gold and the N-questions were added 1 Oct 2026 from the authorised Act v114 / Regs v009 and
# drafted with AI assistance (see docs/AI_USE_LOG.md). STATUS: needs a teammate to check every
# legislation gold unit and answer against the Act before results are final.

- qid: K04
  group: answerable
  style: plain
  q: How much rent can I be asked to pay in advance?
  gold:
    CAV-RENTPAY-04: 2
    CAV-APPLY-01: 1
    CAV-CHANGES-04: 1
    RTA-s40: 2
    RTA-s41: 2
  facts:
  - one month'?s rent|one month
  - 14 days
  answer: No more than one month's rent in advance (14 days if rent is paid weekly); no limit if rent is over $900 a week.
- qid: K07
  group: answerable
  style: plain
  q: How long does my landlord have to do a non-urgent repair?
  gold:
    CAV-REPAIRS-05: 2
    CAV-REPAIRS-08: 1
    RTA-s74: 2
  facts:
  - 14 days
  answer: 14 days from the date of the written request.
- qid: K10
  group: answerable
  style: plain
  q: How often can the landlord do general inspections?
  gold:
    CAV-ENTRY-06: 2
    CAV-ENTRY-04: 1
    RTA-s86: 2
  facts:
  - 6 months
  - 3 months
  answer: Not in the first 3 months, and no more than once every 6 months.
- qid: K16
  group: answerable
  style: plain
  q: What do I need to do with the condition report when I move in?
  gold:
    CAV-CONDREP-02: 2
    CAV-CONDREP-01: 1
    RTA-s35: 2
  facts:
  - (five|5) business days
  answer: Check it, add comments, sign and return a copy within five business days; take dated photos.
- qid: K19
  group: answerable
  style: plain
  q: What kind of heater does a rental property have to have?
  gold:
    CAV-MINSTD-05: 2
    RTR-sch4-c14: 2
  facts:
  - fixed heater
  - main living area
  answer: A fixed (not portable) heater in good working order in the main living area; energy efficient for agreements from
    29 March 2023.
- qid: K22
  group: answerable
  style: plain
  q: How do I dispute a rent increase I think is too high?
  gold:
    CAV-RENTCHAL-01: 2
    CAV-RENTCHAL-02: 2
    CAV-RENTINC-01: 1
    RTA-s45: 2
  facts:
  - 30 days
  - rent assessment|assessment
  answer: Ask Consumer Affairs Victoria for a free rent assessment within 30 days of receiving the notice.
- qid: K25
  group: answerable
  style: plain
  q: Can a landlord refuse to rent to me because I have kids?
  gold:
    CAV-DISCRIM-02: 2
    CAV-APPLY-05: 1
    RTA-s30: 2
  facts:
  - under 16|children
  - main residence|unsuitable
  answer: No, except where the property is the rental provider's main residence or is unsuitable for children.
- qid: K27
  group: answerable
  style: plain
  q: What documents can an agent ask for in a rental application?
  gold:
    CAV-APPLY-03: 2
    CAV-APPLY-02: 1
    CAV-APPLY-04: 1
    RTR-r14B: 1
  facts:
  - identity
  - pay slips|bank statement|Centrelink
  answer: Personal details, employment details, up to two financial documents and up to two identity documents, rental history
    and references.
