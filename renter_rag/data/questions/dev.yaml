- qid: I02
  group: answerable
  style: scenario
  q: My lease just says rent increases will be by "CPI" and my landlord has put it up 8%. Is that allowed?
  gold:
    CAV-RENTINC-03: 2
    CAV-RENTINC-02: 2
    RTA-s44: 1
  facts:
  - CPI
  - invalid|not enough|review
  answer: Simply writing "CPI" is listed as invalid wording; the method must be clear enough to check. You can request a review.
- qid: I04
  group: answerable
  style: scenario
  q: Our hot water system died and a replacement costs $3,200. Can I just get it done and take it out of the rent?
  gold:
    CAV-REPAIRS-04: 2
    CAV-RENTPAY-05: 2
    CAV-REPAIRS-07: 1
    RTR-r32: 2
    RTA-s77: 1
  facts:
  - \$2,?500
  - RDRV|Rental Dispute Resolution
  - must not stop|continue paying|keep paying
  answer: Over $2,500 you should apply to RDRV rather than pay yourself; keep paying rent (you can ask for the Rent Special
    Account).
- qid: I06
  group: answerable
  style: scenario
  q: The agent wants to do an inspection two months after I moved in. Do I have to let them in?
  gold:
    CAV-ENTRY-06: 2
    CAV-ENTRY-04: 2
    RTA-s86: 2
  facts:
  - 3 months|three months
  answer: No. General inspections are only allowed after the first 3 months.
- qid: I09
  group: answerable
  style: scenario
  q: I've been on a month-to-month lease since 2022. How often can my rent go up and how much warning do I get?
  gold:
    CAV-RENTINC-04: 2
    CAV-RENTINC-05: 2
    RTA-s44: 2
  facts:
  - 12 months
  - 90 days
  answer: No more than once every 12 months, with at least 90 days' notice.
- qid: I11
  group: answerable
  style: scenario
  q: The stovetop didn't work when I moved in last week and still hasn't been fixed. Can I end the lease?
  gold:
    CAV-BREAK-02: 2
    CAV-MINSTD-06: 2
    CAV-MINSTD-01: 1
    RTA-s65A: 2
    RTR-sch4-c5: 2
  facts:
  - minimum standards
  - immediate
  answer: A working stovetop is a minimum standard; if the property didn't meet minimum standards at move-in you can end the
    agreement immediately without costs (it is also an urgent repair).
- qid: I13
  group: answerable
  style: scenario
  q: The agent wants to show the house to buyers every day this week. Is that OK?
  gold:
    CAV-ENTRY-08: 2
    CAV-ENTRY-02: 1
    RTA-s86: 2
  facts:
  - twice a week
  answer: No. Sale inspections are limited to twice a week, one hour each, unless you agree, and you are compensated each
    time.
- qid: I15
  group: answerable
  style: scenario
  q: The agent asked for my full bank statements with every transaction and how many bond claims I've had. Are they allowed
    to?
  gold:
    CAV-APPLY-04: 2
    CAV-APPLY-03: 1
    RTR-r15: 1
  facts:
  - transaction
  - bond claim
  answer: No. They can't ask for statements showing daily transactions (you can redact them) or your bond claim history.
