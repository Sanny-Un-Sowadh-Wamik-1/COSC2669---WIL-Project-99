# TEST set (held out): run ONCE with the settings chosen on dev.
#
# group:  answerable | near_miss (sounds like renting law but is not covered: other states, buying,
#         commercial leases, statistics, Centrelink ...) | off_topic (nothing to do with renting,
#         including prompt-injection attempts). The system should answer only `answerable`.
# style:  plain | scenario (a renter's situation) | legal (formal wording) | slang (informal /
#         non-native wording). legal and slang questions reword a plain one (`pair`) for the
#         fairness check, and copy its gold + facts.
# gold:   units that answer it. 2 = answers it, 1 = helpful. Units: RTA-s44 = Residential
#         Tenancies Act 1997 s 44, RTR-r32 = Residential Tenancies Regulations 2021 reg 32,
#         RTR-sch4-c5 = Regulations sch 4 cl 5, RHS-r7 = Rooming House Standards Regs reg 7,
#         CAV-RENTINC-05 = 5th heading of the CAV "Rent increases" page.
# facts:  regular expressions a correct answer must ALL contain (automatic check).
# answer: our reference answer.
#
# CAV gold was checked against the CAV pages saved 28 Sep 2026 (v1, rag_simple). Legislation
# gold and the N-questions were added 1 Oct 2026 from the authorised Act v114 / Regs v009 and
# drafted with AI assistance (see docs/AI_USE_LOG.md). STATUS: needs a teammate to check every
# legislation gold unit and answer against the Act before results are final.

- qid: K01
